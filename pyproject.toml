[project]
name = "mlbplayoffs2026"
version = "0.0.0"
description = "AI MLB prediction and World Series simulation platform for the 2026 season"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

# The workspace root is not itself importable; it only pins the members and dev tools.
dependencies = [
    "mlbsim-core",
    "mlbsim-data",
    "mlbsim-features",
    "mlbsim-models",
    "mlbsim-engine",
    "mlbsim-pipeline",
    "mlbsim-api",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",            # FastAPI TestClient
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mlbsim-core = { workspace = true }
mlbsim-data = { workspace = true }
mlbsim-features = { workspace = true }
mlbsim-models = { workspace = true }
mlbsim-engine = { workspace = true }
mlbsim-pipeline = { workspace = true }
mlbsim-api = { workspace = true }

# ---------------------------------------------------------------------------
# Shared tool configuration (all packages inherit this)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PL", "N", "ARG"]
# PLC0415: lazy imports are used deliberately for optional heavy deps (numba,
# shap, torch) and to keep CLI startup fast.
ignore = ["PLR2004", "PLR0913", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG", "PLR2004", "S101"]
"**/models/*.py" = ["RUF012"]  # SQLAlchemy __table_args__ dict is idiomatic
"**/mlbsim_api/routers/*.py" = ["ARG001"]  # FastAPI path params look "unused"
"db/migrations/versions/*" = ["N999", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
]

[tool.ruff.lint.isort]
known-first-party = [
    "mlbsim_core", "mlbsim_data", "mlbsim_features",
    "mlbsim_models", "mlbsim_engine", "mlbsim_pipeline", "mlbsim_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ['/tests/', '^db/migrations/versions/']
mypy_path = [
    "packages/mlbsim-core/src",
    "packages/mlbsim-data/src",
    "packages/mlbsim-features/src",
    "packages/mlbsim-models/src",
    "packages/mlbsim-engine/src",
    "packages/mlbsim-pipeline/src",
    "packages/mlbsim-api/src",
]

[[tool.mypy.overrides]]
# pandas: pandas-stubs is deferred (frequently lags runtime); revisit in M1.
module = [
    "pandera.*", "shap.*", "statsmodels.*", "numba.*", "sklearn.*", "pandas.*", "joblib.*",
    "anthropic.*", "mlflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = []
markers = [
    "integration: requires a live Postgres/Redis (deselect with -m 'not integration')",
    "network: hits an external API",
    "bench: performance gate (fast; runs in the default suite)",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "db/migrations/*"]

[tool.coverage.report]
# The 85% target is enforced on the *combined* unit + integration run
# (`make coverage`, and CI's database job). The unit-only `--cov` in the quality
# job is informational — the pipeline / API / ingest layers are covered by the
# integration suite against a real Postgres.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.$",
]
