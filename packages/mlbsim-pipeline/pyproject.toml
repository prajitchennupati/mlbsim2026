[project]
name = "mlbsim-pipeline"
version = "0.0.0"
description = "Orchestration flows and the `mlbsim` command-line interface"
requires-python = ">=3.12"
dependencies = [
    "mlbsim-core",
    "mlbsim-data",
    "mlbsim-features",
    "mlbsim-models",
    "mlbsim-engine",
    "typer>=0.12",
    "alembic>=1.13",
]

[project.scripts]
mlbsim = "mlbsim_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbsim_pipeline"]
