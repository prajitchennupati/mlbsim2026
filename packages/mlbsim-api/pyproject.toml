[project]
name = "mlbsim-api"
version = "0.0.0"
description = "Read-only FastAPI service over the serving schema"
requires-python = ">=3.12"
dependencies = [
    "mlbsim-core",
    "mlbsim-data",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbsim_api"]
