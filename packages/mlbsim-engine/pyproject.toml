[project]
name = "mlbsim-engine"
version = "0.0.0"
description = "Plate-appearance game simulator, season Monte Carlo, and playoff bracket"
requires-python = ">=3.12"
dependencies = [
    "mlbsim-core",
    "mlbsim-data",
    "sqlalchemy>=2.0.30",
    "numpy>=1.26",
]

[project.optional-dependencies]
# JIT for the plate-appearance hot loop; required from M3 onward.
jit = ["numba>=0.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbsim_engine"]
