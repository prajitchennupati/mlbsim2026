[project]
name = "mlbsim-data"
version = "0.0.0"
description = "Ingestion, validation, and warehouse loaders for MLB source data"
requires-python = ">=3.12"
dependencies = [
    "mlbsim-core",
    "sqlalchemy>=2.0.30",
    "requests>=2.32",
    "pandas>=2.2",
    "pandera>=0.20",
    "tenacity>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbsim_data"]
