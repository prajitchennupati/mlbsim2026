name: mlbplayoffs2026

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlbsim
      POSTGRES_PASSWORD: mlbsim
      POSTGRES_DB: mlbsim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlbsim -d mlbsim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
